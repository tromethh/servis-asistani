<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servis Bilgi & FS Asistanı</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f242e;
      --text: #eef1f6;
      --muted: #9aa3b2;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.14);
      --ok: #22c55e;
      --ok-bg: rgba(34, 197, 94, 0.14);
      --border: #2b3240;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 17, 21, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .user-pill {
      font-size: 0.88rem;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.16);
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
    }
    .notif-btn {
      background: var(--danger-bg);
      color: #fca5a5;
      border: 1px solid var(--danger);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }
    .notif-btn.ok {
      background: var(--panel-2);
      color: var(--muted);
      border-color: var(--border);
      font-weight: 600;
    }
    main {
      max-width: 980px;
      margin: 18px auto;
      padding: 0 16px 140px;
    }
    .gate-wrap {
      max-width: 520px;
      margin: 48px auto;
      padding: 0 16px;
    }
    .gate-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
    }
    .gate-title {
      font-size: 1.15rem;
      margin: 0 0 8px;
      color: #fca5a5;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 1rem; margin: 0 0 12px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: #262d3a; }
    button.danger { background: var(--danger); color: #fff; }
    button.warn { background: #d97706; color: #fff; }
    button.mic-btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.mic-btn.recording {
      background: var(--danger-bg);
      color: #fca5a5;
      border-color: var(--danger);
    }
    .fs-alert {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 16px;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 1.05rem;
    }
    .summary-box {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: var(--radius);
      padding: 14px;
      margin-top: 12px;
    }
    .record-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .record-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .badge {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .badge.user {
      background: rgba(168, 85, 247, 0.18);
      color: #d8b4fe;
    }
    .badge.err {
      background: var(--danger-bg);
      color: #fca5a5;
    }
    .badge.ok {
      background: var(--ok-bg);
      color: #86efac;
    }
    .badge.work {
      background: var(--warn-bg);
      color: #fcd34d;
    }
    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .queue-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .queue-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.88rem;
    }
    .queue-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
      word-break: break-word;
    }
    .status-msg { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
    .error-msg { font-size: 0.85rem; color: #fca5a5; margin-top: 8px; }
    .hidden { display: none !important; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .bottom-right-dock {
      position: fixed;
      right: 16px;
      bottom: 18px;
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    .dock-btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dock-action-btn {
      background: var(--accent);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }
    .dock-action-btn.upload {
      background: #1d4ed8;
    }
    .dock-action-btn:hover {
      background: var(--accent-hover);
    }
    .upload-pop-menu {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 210px;
    }
    .upload-pop-btn {
      width: 100%;
      text-align: left;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .upload-pop-btn:hover {
      background: #272f3d;
    }

    .toast-stack {
      position: fixed;
      top: 64px;
      right: 16px;
      z-index: 40;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 340px;
    }
    .toast-box {
      background: var(--panel);
      border: 1px solid var(--danger);
      border-left: 4px solid var(--danger);
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      cursor: pointer;
    }
    .toast-title { font-weight: 700; color: #fca5a5; font-size: 0.92rem; }
    .toast-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 560px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
    }
    .preview-img {
      max-width: 100%;
      max-height: 260px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 8px;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <span id="currentUserBadge" class="user-pill hidden">Kullanıcı: -</span>
      <button id="notifToggleBtn" type="button" class="notif-btn ok hidden">Bildirimler (0)</button>
    </div>
  </header>

  <div id="toastStack" class="toast-stack"></div>

  <div id="failedModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <h2 style="margin:0;">Tamamlanamayan İşlemler</h2>
        <button id="closeModalBtn" type="button" class="secondary">Kapat</button>
      </div>
      <div class="actions" style="margin-bottom:12px;">
        <button id="modalBulkDeleteBtn" type="button" class="danger">İşleme Alınamayanları Toplu Sil</button>
      </div>
      <div id="failedList"></div>
    </div>
  </div>

  <div id="textEntryModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px;">
        <h2 style="margin:0;">Metin Yaz ve Kaydet</h2>
        <button id="closeTextModalBtn" type="button" class="secondary">Kapat</button>
      </div>
      <div class="row">
        <div>
          <label for="manualCategory">Kategori</label>
          <select id="manualCategory">
            <option value="Parça Kodları">Parça Kodları</option>
            <option value="Süreçler">Süreçler</option>
          </select>
        </div>
        <div>
          <label for="manualGroup">Model / Alt Grup</label>
          <input id="manualGroup" type="text" placeholder="Örn: V15, Geneli..." />
        </div>
      </div>
      <label for="manualTitle">Başlık</label>
      <input id="manualTitle" type="text" placeholder="Kısa başlık girin..." style="margin-bottom:12px;" />
      <label for="manualContent">Bilgi / Metin</label>
      <textarea id="manualContent" placeholder="Kaydedilecek metni yazın veya sesli dikte kullanın..."></textarea>
      <div class="actions">
        <button id="manualMicBtn" type="button" class="mic-btn">🎤 Sesli Yaz</button>
        <button id="saveManualBtn" type="button">Kaydet</button>
      </div>
      <div id="manualStatus" class="status-msg"></div>
    </div>
  </div>

  <div id="authGate" class="gate-wrap">
    <div class="gate-card">
      <h2 class="gate-title">Giriş Anahtarı Girilmesi Gerekmektedir</h2>
      <p style="color:var(--muted); font-size:0.9rem; margin-top:0;">
        Sisteme erişmek için API Key girin. Anahtarınız <strong>Q</strong> ile bitiyorsa <strong>Arda</strong>, <strong>w</strong> ile bitiyorsa <strong>Görkem</strong> olarak giriş yapılır.
      </p>
      <label for="gateApiKeyInput">API Key</label>
      <input id="gateApiKeyInput" type="password" placeholder="API Key girin..." autocomplete="off" />
      <div class="actions">
        <button id="gateLoginBtn" type="button">Giriş Yap</button>
      </div>
      <div id="gateError" class="error-msg"></div>
    </div>
  </div>

  <main id="appMain" class="hidden">
    <div id="askFormCard" class="card hidden">
      <h2>Soru Sor</h2>
      <div class="row">
        <div>
          <label for="askCategory">Kategori Filtresi (İsteğe Bağlı)</label>
          <select id="askCategory">
            <option value="">Tüm Kategoriler</option>
            <option value="Parça Kodları">Parça Kodları</option>
            <option value="Süreçler">Süreçler</option>
          </select>
        </div>
        <div>
          <label for="askGroup">Model / Alt Grup (İsteğe Bağlı, örn. V15)</label>
          <input id="askGroup" type="text" placeholder="Örn: V15, V11, V16..." />
        </div>
      </div>
      <label for="questionInput">Soru / Model / Parça Kodu</label>
      <textarea id="questionInput" placeholder="Soruyu, cihaz modelini veya parça kodunu yazın ya da mikrofona konuşun..."></textarea>
      <div class="actions">
        <button id="askMicBtn" type="button" class="mic-btn">🎤 Sesli Konuş</button>
        <button id="askBtn" type="button">Kayıtlarda Ara ve Yanıtla</button>
        <button id="clearAskBtn" type="button" class="secondary">Temizle</button>
      </div>
      <div id="askStatus" class="status-msg"></div>
    </div>

    <div id="answerArea"></div>

    <div id="uploadPanelCard" class="card hidden">
      <div class="queue-header">
        <h2 style="margin:0;">Yükleme Sırası <span id="queueCountBadge" class="badge">0</span></h2>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="clearFinishedQueueBtn" type="button" class="secondary">Tamamlananları Temizle</button>
          <button id="bulkDeleteFailedBtn" type="button" class="danger">İşleme Alınamayanları Toplu Sil</button>
        </div>
      </div>
      <div id="uploadStatus" class="status-msg" style="margin-top:0; margin-bottom:8px;"></div>
      <div id="uploadQueueList">
        <p style="color:var(--muted); margin:0; font-size:0.88rem;">Henüz sıraya alınmış işlem yok.</p>
      </div>
    </div>

    <input id="cameraCaptureInput" type="file" accept="image/*" capture="environment" class="hidden" />
    <input id="photoFileInput" type="file" accept="image/*" multiple class="hidden" />
  </main>

  <div id="bottomRightDock" class="bottom-right-dock hidden">
    <div id="uploadPopMenu" class="upload-pop-menu hidden">
      <button id="popTakePhotoBtn" type="button" class="upload-pop-btn">📷 Fotoğraf Çek</button>
      <button id="popUploadPhotoBtn" type="button" class="upload-pop-btn">🖼️ Fotoğraf Yükle</button>
      <button id="popWriteTextBtn" type="button" class="upload-pop-btn">✍️ Metin Yaz</button>
    </div>
    <div class="dock-btn-row">
      <button id="dockAskBtn" type="button" class="dock-action-btn">Soru sor</button>
      <button id="dockUploadBtn" type="button" class="dock-action-btn upload">Bilgi Yükle</button>
    </div>
  </div>

  <script>
    const GEMINI_FALLBACK_MODELS = [
      "gemini-2.5-flash",
      "gemini-2.5-flash-lite",
      "gemini-2.0-flash",
      "gemini-2.0-flash-lite",
      "gemini-3.5-flash-lite",
      "gemini-3.8-flash",
      "gemini-3.5-flash"
    ];

    const SUPABASE_URL = "https://oojtiixfmwdnvpimbtlm.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0LCNWLQnZflockS_Jaaquw_cgSS5Suv";

    const STORAGE_KEY = "servis_asistani_v1";
    const FAILED_STORAGE_KEY = "servis_asistani_failed_v1";
    const SESSION_KEY = "servis_asistani_session_v1";

    let currentSession = loadSession();
    let uploadQueue = [];

    function resolveUserByKey(apiKey) {
      const clean = String(apiKey || "").trim();
      if (!clean) return null;
      const lastChar = clean.slice(-1);
      if (lastChar === "Q" || lastChar === "q") return "Arda";
      if (lastChar === "w" || lastChar === "W") return "Görkem";
      return null;
    }

    function loadSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        const user = resolveUserByKey(parsed?.apiKey);
        if (!parsed?.apiKey || !user) return null;
        return { apiKey: String(parsed.apiKey).trim(), user };
      } catch {
        return null;
      }
    }

    function saveSession(apiKey, user) {
      const payload = JSON.stringify({ apiKey: String(apiKey).trim(), user });
      sessionStorage.setItem(SESSION_KEY, payload);
      localStorage.setItem(SESSION_KEY, payload);
      currentSession = { apiKey: String(apiKey).trim(), user };
    }

    function clearSession() {
      sessionStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(SESSION_KEY);
      currentSession = null;
    }

    function applyAuthState() {
      const gate = document.getElementById("authGate");
      const main = document.getElementById("appMain");
      const userBadge = document.getElementById("currentUserBadge");
      const notifBtn = document.getElementById("notifToggleBtn");
      const dock = document.getElementById("bottomRightDock");

      if (currentSession && currentSession.apiKey && currentSession.user) {
        gate.classList.add("hidden");
        main.classList.remove("hidden");
        userBadge.classList.remove("hidden");
        notifBtn.classList.remove("hidden");
        dock.classList.remove("hidden");
        userBadge.textContent = `Kullanıcı: ${currentSession.user}`;
        updateNotifButton();
        syncFromCloud();
      } else {
        gate.classList.remove("hidden");
        main.classList.add("hidden");
        userBadge.classList.add("hidden");
        notifBtn.classList.add("hidden");
        dock.classList.add("hidden");
        closeFailedModal();
      }
    }

    document.getElementById("gateLoginBtn").addEventListener("click", () => {
      const input = document.getElementById("gateApiKeyInput");
      const errEl = document.getElementById("gateError");
      const key = input.value.trim();

      if (!key) {
        errEl.textContent = "Giriş Anahtarı Girilmesi Gerekmektedir";
        return;
      }

      const user = resolveUserByKey(key);
      if (!user) {
        errEl.textContent = "Geçersiz anahtar sonu. Anahtar son harfi Q (Arda) veya w (Görkem) olmalıdır.";
        return;
      }

      errEl.textContent = "";
      saveSession(key, user);
      input.value = "";
      applyAuthState();
    });

    document.getElementById("gateApiKeyInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        document.getElementById("gateLoginBtn").click();
      }
    });

    const dockAskBtn = document.getElementById("dockAskBtn");
    const dockUploadBtn = document.getElementById("dockUploadBtn");
    const uploadPopMenu = document.getElementById("uploadPopMenu");
    const askFormCard = document.getElementById("askFormCard");
    const uploadPanelCard = document.getElementById("uploadPanelCard");
    const cameraCaptureInput = document.getElementById("cameraCaptureInput");
    const photoFileInput = document.getElementById("photoFileInput");

    dockAskBtn.addEventListener("click", () => {
      uploadPopMenu.classList.add("hidden");
      askFormCard.classList.remove("hidden");
      document.getElementById("questionInput").focus();
      askFormCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });

    dockUploadBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      uploadPopMenu.classList.toggle("hidden");
    });

    document.addEventListener("click", (e) => {
      if (!uploadPopMenu.classList.contains("hidden") && !e.target.closest("#bottomRightDock")) {
        uploadPopMenu.classList.add("hidden");
      }
    });

    document.getElementById("popTakePhotoBtn").addEventListener("click", () => {
      uploadPopMenu.classList.add("hidden");
      uploadPanelCard.classList.remove("hidden");
      cameraCaptureInput.click();
    });

    document.getElementById("popUploadPhotoBtn").addEventListener("click", () => {
      uploadPopMenu.classList.add("hidden");
      uploadPanelCard.classList.remove("hidden");
      photoFileInput.click();
    });

    const textEntryModal = document.getElementById("textEntryModal");
    document.getElementById("popWriteTextBtn").addEventListener("click", () => {
      uploadPopMenu.classList.add("hidden");
      document.getElementById("manualStatus").textContent = "";
      textEntryModal.classList.remove("hidden");
      document.getElementById("manualTitle").focus();
    });

    document.getElementById("closeTextModalBtn").addEventListener("click", () => {
      textEntryModal.classList.add("hidden");
    });

    cameraCaptureInput.addEventListener("change", async (e) => {
      const files = e.target.files ? Array.from(e.target.files) : [];
      cameraCaptureInput.value = "";
      if (!files.length) return;
      uploadPanelCard.classList.remove("hidden");
      await runImageBatch(files);
    });

    photoFileInput.addEventListener("change", async (e) => {
      const files = e.target.files ? Array.from(e.target.files) : [];
      photoFileInput.value = "";
      if (!files.length) return;
      uploadPanelCard.classList.remove("hidden");
      await runImageBatch(files);
    });

    function startVoiceInput(targetTextarea, buttonEl, statusEl) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (statusEl) statusEl.textContent = "Bu tarayıcıda sesli konuşma desteklenmiyor.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "tr-TR";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      buttonEl.classList.add("recording");
      const originalText = buttonEl.textContent;
      buttonEl.textContent = "🔴 Dinleniyor...";
      if (statusEl) statusEl.textContent = "Konuşmaya başlayabilirsiniz...";

      recognition.onresult = (event) => {
        const transcript = event.results?.[0]?.[0]?.transcript || "";
        if (transcript) {
          const current = targetTextarea.value.trim();
          targetTextarea.value = current ? `${current} ${transcript}` : transcript;
          if (statusEl) statusEl.textContent = `Algılandı: "${transcript}"`;
        }
      };

      recognition.onerror = (event) => {
        if (statusEl) statusEl.textContent = `Sesli konuşma hatası: ${event.error || "algılanamadı"}`;
      };

      recognition.onend = () => {
        buttonEl.classList.remove("recording");
        buttonEl.textContent = originalText;
      };

      recognition.start();
    }

    document.getElementById("askMicBtn").addEventListener("click", () => {
      startVoiceInput(
        document.getElementById("questionInput"),
        document.getElementById("askMicBtn"),

      try {
        return new Date(isoStr || Date.now()).toLocaleString("tr-TR", {

          year: "numeric",
          hour: "2-digit",

          ? parsed.records.map(normalizeRecord)

        return { schemaVersion: 1, records: recs };

        return { schemaVersion: 1, records: [] };

    function getSbConfig() {
      const url = (SUPABASE_URL || "").trim().replace(/\/+$/, "");
      const key = (SUPABASE_PUBLISHABLE_KEY || "").trim();
      return (url && key) ? { url, key } : null;
    }

    async function sbFetchRecords() {
      const cfg = getSbConfig();
      if (!cfg) return null;
      const res = await fetch(`${cfg.url}/rest/v1/records?select=*&order=updated_at.desc`, {
        headers: {
          "apikey": cfg.key,
          "Authorization": `Bearer ${cfg.key}`
        }
      });
      if (!res.ok) throw new Error(`Supabase okuma hatası (${res.status})`);
      const rows = await res.json();
      return rows.map(row => normalizeRecord(row));
    }

    async function sbUpsertRecords(recs) {
      const cfg = getSbConfig();
      if (!cfg || !recs.length) return;
      const fullPayload = recs.map(r => ({
        id: r.id,
        category: normalizeCategory(r.category),
        group: r.group,
        title: r.title,
        content: r.content,
        uploaded_by: r.uploadedBy || currentSession?.user || "Bilinmiyor",
        uploaded_at: r.uploadedAt || r.updatedAt,
        updated_at: r.updatedAt
      }));

      let res = await fetch(`${cfg.url}/rest/v1/records`, {
        method: "POST",
        headers: {
          "apikey": cfg.key,
          "Authorization": `Bearer ${cfg.key}`,
          "Content-Type": "application/json",
          "Prefer": "resolution=merge-duplicates"
        },
        body: JSON.stringify(fullPayload)
      });

      if (!res.ok) {
        const basicPayload = recs.map(r => ({
          id: r.id,
          category: normalizeCategory(r.category),
          group: r.group,
          title: r.title,
          content: r.content,
          updated_at: r.updatedAt
        }));
        res = await fetch(`${cfg.url}/rest/v1/records`, {
          method: "POST",
          headers: {
            "apikey": cfg.key,
            "Authorization": `Bearer ${cfg.key}`,
            "Content-Type": "application/json",
            "Prefer": "resolution=merge-duplicates"
          },
          body: JSON.stringify(basicPayload)
        });
      }

      if (!res.ok) throw new Error(`Supabase yazma hatası (${res.status})`);
    }

    async function sbDeleteRecord(id) {
      const cfg = getSbConfig();
      if (!cfg) return;
      await fetch(`${cfg.url}/rest/v1/records?id=eq.${encodeURIComponent(id)}`, {
        method: "DELETE",
        headers: {
          "apikey": cfg.key,
          "Authorization": `Bearer ${cfg.key}`
        }
      });
    }

    async function syncFromCloud() {
      const cfg = getSbConfig();
      if (!cfg) return;
      try {
        const remote = await sbFetchRecords();
        const localById = new Map(state.records.map(r => [r.id, r]));
        state.records = remote.map(rem => {
          const loc = localById.get(rem.id);
          return {
            ...rem,
            uploadedBy: rem.uploadedBy !== "Bilinmiyor" ? rem.uploadedBy : (loc?.uploadedBy || "Bilinmiyor"),
            uploadedAt: rem.uploadedAt || loc?.uploadedAt || rem.updatedAt
          };
        });
        saveLocalState(state);
      } catch {}
    }

    function optimizeImageFile(file, maxSide = 1152, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const rawDataUrl = String(reader.result || "");
          const img = new Image();
          img.onerror = () => {
            const parts = rawDataUrl.split(",");
            resolve({
              dataUrl: rawDataUrl,
              base64: parts[1] || "",
              mimeType: file.type || "image/jpeg"
            });
          };
          img.onload = () => {
            let width = img.naturalWidth || img.width;
            let height = img.naturalHeight || img.height;
            if (width > maxSide || height > maxSide) {
              if (width >= height) {
                height = Math.round((height * maxSide) / width);
                width = maxSide;
              } else {
                width = Math.round((width * maxSide) / height);
                height = maxSide;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
            const base64 = compressedDataUrl.split(",")[1] || "";
            const approxKb = Math.round((base64.length * 3) / 4 / 1024);
            resolve({
              dataUrl: compressedDataUrl,
              base64,
              mimeType: "image/jpeg",
              approxKb
            });
          };
          img.src = rawDataUrl;
        };
        reader.readAsDataURL(file);
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function fetchWithTimeout(url, options, timeoutMs = 35000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } catch (err) {
        if (err.name === "AbortError") {
          throw new Error("İstek zaman aşımına uğradı (mobil ağ yavaş olabilir).");
        }
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    async function trySingleModel(apiKey, modelName, parts, systemInstruction) {
      const cleanKey = String(apiKey || "").trim();
      const isAqKey = /^AQ/i.test(cleanKey);

      const baseUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName)}:generateContent`;
      const url = isAqKey ? baseUrl : `${baseUrl}?key=${encodeURIComponent(cleanKey)}`;

      const headers = { "Content-Type": "application/json" };
      if (isAqKey) {
        headers["x-goog-api-key"] = cleanKey;
      }

      const body = {
        contents: [{ role: "user", parts }],
        systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
      };

      const res = await fetchWithTimeout(url, {
        method: "POST",
        headers,
        body: JSON.stringify(body)
      }, 35000);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || `API hatası (${res.status})`);
      }
      const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
      if (!text.trim()) {
        throw new Error("Boş yanıt döndü.");
      }
      return text;
    }

    async function callGemini(parts, systemInstruction) {
      const apiKey = (currentSession?.apiKey || "").trim();
      if (!apiKey) {
        clearSession();
        applyAuthState();
        throw new Error("Giriş Anahtarı Girilmesi Gerekmektedir");
      }

      const models = Array.isArray(GEMINI_FALLBACK_MODELS) && GEMINI_FALLBACK_MODELS.length
        ? GEMINI_FALLBACK_MODELS
        : ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-2.0-flash"];

      const errors = [];
      for (let i = 0; i < models.length; i++) {
        const modelName = models[i];
        let attempt = 0;
        const maxRetries = 2;

        while (attempt <= maxRetries) {
          try {
            return await trySingleModel(apiKey, modelName, parts, systemInstruction);
          } catch (err) {
            const isHighDemand = /high demand|overloaded|429|503|unavailable/i.test(err.message);
            if (isHighDemand && attempt < maxRetries) {
              attempt++;
              await sleep(1200 * attempt);
              continue;
            }
            errors.push(`${modelName}: ${err.message}`);
            break;
          }
        }
      }

      throw new Error(`Hiçbir model işlemi tamamlayamadı. ${errors.join(" | ")}`);
    }

    function parseAutoClassification(rawText, fallbackFileName) {
      const jsonMatch = rawText.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        try {
          const obj = JSON.parse(jsonMatch[0]);
          const category = normalizeCategory(obj.category);
          const group = String(obj.group || "Geneli").trim() || "Geneli";
          const title = String(obj.title || fallbackFileName || "Otomatik Kayıt").trim();
          const content = String(obj.content || rawText).trim();
          return { category, group, title, content };
        } catch {}
      }
      return {
        category: "Süreçler",
        group: "Geneli",
        title: (fallbackFileName || "Kayıt").replace(/\.[^.]+$/, ""),
        content: rawText.trim()
      };
    }

    async function commitRecord(newRec) {
      const normalizedRec = normalizeRecord(newRec);
      state.records.unshift(normalizedRec);
      saveLocalState(state);
      try {
        await sbUpsertRecords([normalizedRec]);
      } catch {}
    }

    async function processImagePayload(fileName, mimeType, base64, dataUrl, queueId = null, approxKb = null) {
      const kbText = approxKb ? ` (~${approxKb} KB sıkıştırıldı)` : "";
      if (queueId) updateQueueItem(queueId, "processing", `OCR ve kategori ayrıştırma yapılıyor${kbText}...`);
      try {
        const prompt = `Bu görseldeki tüm metni eksiksiz yazıya dök. Parça kodlarını, model adlarını ve soru-cevap yapısını koru.
Kategoriyi yalnızca şu iki seçenekten birine göre belirle: "Parça Kodları" veya "Süreçler".
Ardından yalnızca şu JSON formatında yanıt ver (başka açıklama yazma):
{
  "category": "Parça Kodları" veya "Süreçler",
  "group": "Varsa ürün modeli veya kısa alt grup (örn: V15, V11, V16, Geneli)",
  "title": "İçeriği özetleyen kısa ve net otomatik başlık",
  "content": "Görseldeki metnin tam ve düzenli dökümü"
}`;

        const rawReply = await callGemini([
          { inlineData: { mimeType: mimeType || "image/jpeg", data: base64 } },
          { text: prompt }
        ]);

        const parsed = parseAutoClassification(rawReply, fileName);
        const nowIso = new Date().toISOString();
        const uploader = currentSession?.user || "Bilinmiyor";

        const newRec = {
          id: "rec_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          category: parsed.category,
          group: parsed.group,
          title: parsed.title,
          content: parsed.content,
          uploadedBy: uploader,
          uploadedAt: nowIso,
          updatedAt: nowIso
        };

        await commitRecord(newRec);
        if (queueId) {
          updateQueueItem(queueId, "done", `${parsed.category} / ${parsed.group} — "${parsed.title}" | Yükleyen Kişi: ${uploader} | Saat: ${formatDateTr(nowIso)}`);
        }
      } catch (err) {
        recordFailure(fileName, mimeType, base64, dataUrl, err.message);
        if (queueId) {
          updateQueueItem(queueId, "error", err.message);
        }
      }
    }

    async function runImageBatch(files) {
      const statusEl = document.getElementById("uploadStatus");
      if (!files.length) {
        statusEl.textContent = "Lütfen önce en az bir görsel seçin.";
        return;
      }

      uploadQueue = uploadQueue.filter(item => item.status === "queued" || item.status === "processing");
      const batchItems = files.map(f => ({
        file: f,
        queueId: addQueueItem(f.name)
      }));

      statusEl.textContent = `${batchItems.length} görsel sıraya alındı, sıkıştırılıp işleniyor...`;

      for (const entry of batchItems) {
        updateQueueItem(entry.queueId, "processing", "Fotoğraf sıkıştırılıyor...");
        try {
          const { dataUrl, base64, mimeType, approxKb } = await optimizeImageFile(entry.file, 1152, 0.75);
          await processImagePayload(
            entry.file.name,
            mimeType,
            base64,
            dataUrl,
            entry.queueId,
            approxKb
          );
        } catch (err) {
          recordFailure(entry.file.name, entry.file.type || "image/jpeg", "", "", err.message);
          updateQueueItem(entry.queueId, "error", err.message);
        }
      }

      const batchErrors = batchItems.filter(b => {
        const q = uploadQueue.find(x => x.id === b.queueId);
        return q && q.status === "error";
      }).length;

      if (batchErrors === 0) {
        statusEl.textContent = "Tüm görseller sıkıştırılıp otomatik olarak kaydedildi.";
      } else {
        statusEl.textContent = `${batchErrors} görsel tamamlanamadı; Bildirimler alanından kontrol edebilirsiniz.`;
      }
    }

    document.getElementById("askBtn").addEventListener("click", async () => {
      await syncFromCloud();
      const question = document.getElementById("questionInput").value.trim();
      const catFilter = document.getElementById("askCategory").value;
      const grpFilter = document.getElementById("askGroup").value.trim().toLowerCase();
      const statusEl = document.getElementById("askStatus");
      const areaEl = document.getElementById("answerArea");

      if (!question) {
        statusEl.textContent = "Lütfen bir soru, model veya parça kodu girin.";
        return;
      }

      const pool = state.records.filter(r => {
        const recCat = normalizeCategory(r.category);
        if (catFilter && recCat !== catFilter) return false;
        if (grpFilter && !r.group.toLowerCase().includes(grpFilter)) return false;
        return true;
      });

      if (!pool.length) {
        areaEl.innerHTML = `<div class="fs-alert">FS desteği alınması gerekir</div>`;
        statusEl.textContent = "Seçili filtrelerde kayıt bulunamadı.";
        return;
      }

      statusEl.textContent = "Kayıtlı bilgiler kontrol ediliyor...";
      areaEl.innerHTML = "";

      const contextText = pool.map((raw, idx) => {
        const r = normalizeRecord(raw);
        return `[KAYIT #${idx + 1} | Kategori: ${r.category} | Grup: ${r.group} | Yükleyen Kişi: ${r.uploadedBy} | Yükleme Zamanı: ${formatDateTr(r.uploadedAt)} | Başlık: ${r.title}]\n${r.content}`;
      }).join("\n\n---\n\n");

      const sysRule = `Sen bir teknik destek eşleştirme asistanısın.
KESİN KURAL:
1. Yalnızca sana aşağıda verilen KAYITLAR içindeki bilgilere dayan. Kendi genel bilginden veya tahmininden ASLA cevap üretme.
2. Kullanıcının sorusu, modeli veya parça koduyla doğrudan ilgili bilgi KAYITLAR içinde YOKSA veya yetersizse, başka hiçbir şey yazmadan TAM OLARAK şu metni döndür:
FS desteği alınması gerekir
3. Kayıtlarda doğrudan karşılığı VARSA:
- İlgili kayıt başlıklarını, yükleyen kişiyi, yükleme tarih/saatini ve ilgili bilgileri belirt.
- En sonda yalnızca bu kayıtlara dayanan kısa (1-3 cümle) "Yapılması gereken" özeti yaz.`;

      try {
        const reply = await callGemini([
          { text: `KAYITLAR:\n${contextText}\n\nSORU / ARAMA:\n${question}` }
        ], sysRule);

        const clean = reply.trim();
        if (clean.includes("FS desteği alınması gerekir") && clean.length < 120) {
          areaEl.innerHTML = `<div class="fs-alert">FS desteği alınması gerekir</div>`;
        } else {
          areaEl.innerHTML = `<div class="card"><h2>Eşleşen Kayıtlar ve Yönlendirme</h2><div class="summary-box"><pre style="white-space:pre-wrap; font-family:inherit; margin:0;">${escapeHtml(clean)}</pre></div></div>`;
        }
        statusEl.textContent = "Tamamlandı.";
      } catch (err) {
        statusEl.textContent = "Hata: " + err.message;
      }
    });

    document.getElementById("clearAskBtn").addEventListener("click", () => {
      document.getElementById("questionInput").value = "";
      document.getElementById("answerArea").innerHTML = "";
      document.getElementById("askStatus").textContent = "";
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    closeFailedModal();
    renderUploadQueue();
    applyAuthState();
  </script>
</body>
</html>
