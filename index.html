<script>
(function () {
  if (typeof window.renderRecordsModalList !== "function") return;

  let siraModu = "newest"; // "newest" | "oldest" | "title"
  let seciliYukleyen = "ALL";
  let aktifAcikId = null;

  function filtreBariniHazirla() {
    const stepList = document.getElementById("stepRecordsList");
    const listEl = document.getElementById("recordsModalList");
    if (!stepList || !listEl) return;

    let bar = document.getElementById("sadeSiralamaFiltreBar");
    if (!bar) {
      const eskiSortBar = stepList.querySelector(".sort-bar");
      bar = document.createElement("div");
      bar.id = "sadeSiralamaFiltreBar";
      bar.style.cssText =
        "display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;";

      bar.innerHTML = `
        <button id="siraYeniEskiBtn" type="button" class="sort-btn active">Tarih: Yeni → Eski</button>
        <button id="siraEskiYeniBtn" type="button" class="sort-btn">Tarih: Eski → Yeni</button>
        <button id="siraBaslikBtn" type="button" class="sort-btn">Başlık (A–Z)</button>
        <select id="yukleyenKisiFiltreSelect" style="width:auto; min-width:165px; padding:7px 11px; font-size:0.84rem; border-radius:999px;">
          <option value="ALL">Yükleyen: Tümü</option>
        </select>
      `;

      if (eskiSortBar) {
        eskiSortBar.replaceWith(bar);
      } else {
        stepList.insertBefore(bar, listEl);
      }

      document.getElementById("siraYeniEskiBtn").addEventListener("click", () => {
        siraModu = "newest";
        aktifAcikId = null;
        butonAktiflikGuncelle();
        window.renderRecordsModalList();
      });

      document.getElementById("siraEskiYeniBtn").addEventListener("click", () => {
        siraModu = "oldest";
        aktifAcikId = null;
        butonAktiflikGuncelle();
        window.renderRecordsModalList();
      });

      document.getElementById("siraBaslikBtn").addEventListener("click", () => {
        siraModu = "title";
        aktifAcikId = null;
        butonAktiflikGuncelle();
        window.renderRecordsModalList();
      });

      document.getElementById("yukleyenKisiFiltreSelect").addEventListener("change", (e) => {
        seciliYukleyen = e.target.value || "ALL";
        aktifAcikId = null;
        window.renderRecordsModalList();
      });
    }

    yukleyenSecenekleriniGuncelle();
  }

  function butonAktiflikGuncelle() {
    document.getElementById("siraYeniEskiBtn")?.classList.toggle("active", siraModu === "newest");
    document.getElementById("siraEskiYeniBtn")?.classList.toggle("active", siraModu === "oldest");
    document.getElementById("siraBaslikBtn")?.classList.toggle("active", siraModu === "title");
  }

  function yukleyenSecenekleriniGuncelle() {
    const sel = document.getElementById("yukleyenKisiFiltreSelect");
    if (!sel) return;

    const kisiler = new Set(["Arda", "Görkem"]);
    for (const raw of (state?.records || [])) {
      const r = typeof normalizeRecord === "function" ? normalizeRecord(raw) : raw;
      if (r?.uploadedBy && r.uploadedBy !== "Bilinmiyor") {
        kisiler.add(String(r.uploadedBy).trim());
      }
    }

    const onceki = seciliYukleyen;
    sel.innerHTML = `<option value="ALL">Yükleyen: Tümü</option>` +
      Array.from(kisiler).map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join("");

    if (onceki && (onceki === "ALL" || kisiler.has(onceki))) {
      sel.value = onceki;
    } else {
      seciliYukleyen = "ALL";
      sel.value = "ALL";
    }
  }

  window.sadeKayitAcKapat = function (id) {
    aktifAcikId = aktifAcikId === id ? null : id;
    window.renderRecordsModalList();
  };

  window.renderRecordsModalList = function () {
    filtreBariniHazirla();
    butonAktiflikGuncelle();

    const q = (document.getElementById("recordsModalSearch")?.value || "").trim().toLowerCase();
    const listEl = document.getElementById("recordsModalList");
    if (!listEl) return;

    const filtered = (state?.records || [])
      .map(r => (typeof normalizeRecord === "function" ? normalizeRecord(r) : r))
      .filter(r => {
        if (typeof selectedMainCat !== "undefined" && selectedMainCat && r.category !== selectedMainCat) return false;
        if (typeof selectedMainCat !== "undefined" && selectedMainCat === "Parça Kodları" && typeof selectedPartSub !== "undefined" && selectedPartSub) {
          if (typeof matchesPartSubType === "function" && !matchesPartSubType(r, selectedPartSub)) return false;
        } else if (typeof selectedMainCat !== "undefined" && selectedMainCat && selectedMainCat !== "Süreçler" && typeof selectedPartSub !== "undefined" && selectedPartSub && selectedPartSub !== "Geneli") {
          if (r.group !== selectedPartSub) return false;
        }
        if (seciliYukleyen !== "ALL" && String(r.uploadedBy || "").trim() !== seciliYukleyen) {
          return false;
        }
        if (!q) return true;
        return (
          String(r.title || "").toLowerCase().includes(q) ||
          String(r.content || "").toLowerCase().includes(q) ||
          String(r.group || "").toLowerCase().includes(q) ||
          String(r.category || "").toLowerCase().includes(q) ||
          String(r.uploadedBy || "").toLowerCase().includes(q)
        );
      });

    filtered.sort((a, b) => {
      if (siraModu === "title") {
        return String(a.title || "").localeCompare(String(b.title || ""), "tr", { sensitivity: "base" });
      }
      const tA = new Date(a.uploadedAt || a.updatedAt || 0).getTime() || 0;
      const tB = new Date(b.uploadedAt || b.updatedAt || 0).getTime() || 0;
      return siraModu === "oldest" ? (tA - tB) : (tB - tA);
    });

    if (!filtered.length) {
      listEl.innerHTML = `<p style="color:var(--muted); margin:0;">Bu seçimde kayıt bulunmuyor.</p>`;
      return;
    }

    listEl.innerHTML = filtered.map(r => {
      const acikMi = aktifAcikId === r.id;
      const tarihStr = typeof formatDateTr === "function" ? formatDateTr(r.uploadedAt) : (r.uploadedAt || "");
      return `
        <div style="margin-bottom:8px;">
          <div class="title-only-item" onclick="sadeKayitAcKapat('${escapeHtml(r.id)}')">
            <strong style="color:#ffffff;">${escapeHtml(r.title || "Başlıksız Kayıt")}</strong>
            <span class="badge">${acikMi ? "Kapat" : "Aç"}</span>
          </div>
          ${acikMi ? `
            <div class="record-item" style="margin-top:-4px;">
              <div class="record-meta">
                <span class="badge">${escapeHtml(r.category || "Genel")}</span>
                <span class="badge">${escapeHtml(r.group || "Geneli")}</span>
                <span class="badge user">Yükleyen Kişi: ${escapeHtml(r.uploadedBy || "Bilinmiyor")}</span>
                <span>Tarih/Saat: ${escapeHtml(tarihStr)}</span>
              </div>
              <pre style="white-space:pre-wrap; font-family:inherit; margin:8px 0 0; color:var(--text);">${escapeHtml(r.content || "")}</pre>
              <div class="actions">
                <button type="button" class="danger" onclick="deleteRecordFromModal('${escapeHtml(r.id)}')">Sil</button>
              </div>
            </div>
          ` : ""}
        </div>
      `;
    }).join("");
  };
})();
</script>
<script>

(function () {

const SISTEM_KATEGORILER = new Set(["VardiyaPlanı", "AktifMola", "VardiyaDevirNotu", "İşleme Alınamayanlar"]);



function bugunTarihAnahtari(tarihStr) {

const d = tarihStr ? new Date(tarihStr) : new Date();

if (Number.isNaN(d.getTime())) return "";

const yil = d.getFullYear();

const ay = String(d.getMonth() + 1).padStart(2, "0");

const gun = String(d.getDate()).padStart(2, "0");

return `${yil}-${ay}-${gun}`;

}



function bugununKayitlariniGetir() {

if (!state || !Array.isArray(state.records)) return [];

const bugun = bugunTarihAnahtari(new Date().toISOString());



return state.records

.map(raw => (typeof normalizeRecord === "function" ? normalizeRecord(raw) : raw))

.filter(r => {

if (!r || !r.id) return false;

if (SISTEM_KATEGORILER.has(r.category)) return false;

return bugunTarihAnahtari(r.uploadedAt || r.updatedAt) === bugun;

})

.sort((a, b) => {

const tA = new Date(a.uploadedAt || a.updatedAt || 0).getTime() || 0;

const tB = new Date(b.uploadedAt || b.updatedAt || 0).getTime() || 0;

return tB - tA;

});

}



function bugunEklenenlerKutusuOlustur() {

const bar = document.getElementById("vardiyaAnaBar");

if (!bar || document.getElementById("bugunEklenenlerKutusu")) return;



const kutu = document.createElement("div");

kutu.id = "bugunEklenenlerKutusu";

kutu.style.cssText =

"width:100%; background:var(--panel); border:1px solid var(--neon-cyan);" +

"border-radius:14px; padding:12px 14px; box-shadow:0 0 18px rgba(0,240,255,0.16);";



kutu.innerHTML = `

<button id="bugunEklenenlerToggleBtn" type="button" style="width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; background:transparent; border:none; box-shadow:none; padding:2px 0; color:#ffffff; text-align:left;">

<span style="font-weight:800; font-size:0.9rem; color:var(--neon-cyan);">Bugün Eklenen Kayıtlar</span>

<span id="bugunEklenenlerAdetBadge" class="badge">0 kayıt • Aç</span>

</button>

<div id="bugunEklenenlerListe" class="hidden" style="margin-top:10px; max-height:320px; overflow-y:auto;"></div>

`;



bar.insertBefore(kutu, bar.firstChild);



const toggleBtn = document.getElementById("bugunEklenenlerToggleBtn");

const listeEl = document.getElementById("bugunEklenenlerListe");



toggleBtn.addEventListener("click", async () => {

const aciliyor = listeEl.classList.contains("hidden");

if (aciliyor && typeof syncFromCloud === "function") {

await syncFromCloud();

}

listeEl.classList.toggle("hidden", !aciliyor);

bugunEklenenlerArayuzGuncelle();

});

}



function bugunEklenenlerArayuzGuncelle() {

const badgeEl = document.getElementById("bugunEklenenlerAdetBadge");

const listeEl = document.getElementById("bugunEklenenlerListe");

if (!badgeEl || !listeEl) return;



const kayitlar = bugununKayitlariniGetir();

const acikMi = !listeEl.classList.contains("hidden");

badgeEl.textContent = `${kayitlar.length} kayıt • ${acikMi ? "Gizle" : "Göster"}`;



if (!acikMi) return;



if (!kayitlar.length) {

listeEl.innerHTML = `<p class="status-msg" style="margin:0;">Bugün henüz yeni kayıt eklenmemiş.</p>`;

return;

}



listeEl.innerHTML = kayitlar.map(r => {

const saatStr = typeof formatDateTr === "function"

? formatDateTr(r.uploadedAt || r.updatedAt)

: (r.uploadedAt || "");

return `

<div class="record-item" style="margin-bottom:8px; padding:10px;">

<div class="record-meta" style="margin-bottom:4px;">

<span class="badge">${escapeHtml(r.category || "Genel")}</span>

<span class="badge">${escapeHtml(r.group || "Geneli")}</span>

<span class="badge user">${escapeHtml(r.uploadedBy || "Bilinmiyor")}</span>

<span>${escapeHtml(saatStr)}</span>

</div>

<div style="font-weight:800; color:#ffffff; font-size:0.92rem; margin-bottom:4px;">

${escapeHtml(r.title || "Başlıksız Kayıt")}

</div>

<pre style="white-space:pre-wrap; font-family:inherit; margin:0; font-size:0.84rem; color:var(--text);">${escapeHtml(r.content || "")}</pre>

</div>

`;

}).join("");

}



const _origSonBilgiGuncelle = window.sonBilgiKartiniYerlestirVeGuncelle;

if (typeof _origSonBilgiGuncelle === "function") {

window.sonBilgiKartiniYerlestirVeGuncelle = function () {

_origSonBilgiGuncelle();

bugunEklenenlerArayuzGuncelle();

};

}



bugunEklenenlerKutusuOlustur();

bugunEklenenlerArayuzGuncelle();

})();

</script>
